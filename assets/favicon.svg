<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="fav-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square with dark cyberpunk fill -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#070A18" stroke="url(#fav-grad)" stroke-width="2.5" />

  <!-- Quantum Orbits -->
  <ellipse cx="50" cy="50" rx="36" ry="13" fill="none" 
           stroke="#22D3EE" stroke-width="2.2" transform="rotate(-35, 50, 50)" />
  <circle cx="78" cy="34" r="3.5" fill="#FFFFFF" filter="url(#fav-glow)" />

  <ellipse cx="50" cy="50" rx="36" ry="13" fill="none" 
           stroke="#8B5CF6" stroke-width="2.2" transform="rotate(35, 50, 50)" />
  <circle cx="22" cy="34" r="3.5" fill="#A78BFA" filter="url(#fav-glow)" />

  <!-- Nucleus -->
  <circle cx="50" cy="50" r="10" fill="url(#fav-grad)" filter="url(#fav-glow)" />
  <circle cx="50" cy="50" r="4" fill="#FFFFFF" />

  <!-- Laser Cut Slice -->
  <line x1="12" y1="86" x2="88" y2="14" stroke="url(#fav-laser)" stroke-width="4" filter="url(#fav-glow)" />
  <circle cx="50" cy="50" r="2" fill="#FFFFFF" />
</svg>
