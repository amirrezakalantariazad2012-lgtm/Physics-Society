# ==============================================================================
# Nginx Configuration: Physics Association Platform - Shahid Beheshti 2 School
# High Performance Reverse Proxy, SSL Termination & Static Asset Caching
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Maximum file upload size (needed for official PDF textbooks up to 50MB)
    client_max_body_size 50M;

    # Rate Limiting Zones to protect against brute-force and DDoS
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream backend service
    upstream fastapi_backend {
        server app:8000;
        keepalive 32;
    }

    # ==========================================================================
    # HTTP Server (Port 80) - Handles Let's Encrypt Verification & Proxying
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME-challenge for Certbot SSL renewals
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Never expose private application folders or storage artefacts
        location ~ ^/(backend|data|deploy|\.git|\.backup)/ {
            deny all;
            return 404;
        }
        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }
        location ~* \.(env|db|sqlite|sqlite3|sql|log|ini|bak|sh)$ {
            deny all;
            return 404;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Rate-limited Auth endpoints
        location /api/auth/login {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rate-limited General API endpoints
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Static assets direct serving & caching
        location /css/ {
            alias /var/www/frontend/css/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        location /js/ {
            alias /var/www/frontend/js/;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # Default fallback to FastAPI SPA handler
        location / {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
